groups:
  - name: smart-skin-edge
    rules:
      - alert: SmartSkinCaddyUpstreamUnhealthy
        expr: min(caddy_reverse_proxy_upstreams_healthy) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Smart Skin AI Waitress upstream is unhealthy
          runbook: Review the SmartSkinAI Windows service, protected logs, and public synthetic check. Do not include request bodies in tickets.

      - alert: SmartSkinCaddyHigh5xxRate
        expr: |
          (
            sum(rate(caddy_http_request_duration_seconds_count{code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(caddy_http_request_duration_seconds_count[5m])), 0.001)
          ) > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Smart Skin AI gateway 5xx ratio is above 2 percent
          runbook: Confirm synthetic checks and upstream health first; inspect redacted logs only.

      - alert: SmartSkinCaddySlowRequests
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(caddy_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Smart Skin AI gateway p95 latency exceeds 3 seconds
          runbook: Check edge, Waitress, storage, and dependency saturation. Do not add payload logging to investigate.
