<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ | Smart Skin AI</title>
    <script nonce="{{ csp_nonce }}" src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Anuphan:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', 'Anuphan', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-950 px-4 py-10 text-slate-900 sm:flex sm:items-center sm:justify-center">
    <main class="w-full max-w-md rounded-[2rem] border border-slate-200 bg-white p-7 shadow-2xl sm:p-9">
        <span class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-teal-50 text-xl text-teal-700">✓</span>
        <h1 class="mt-5 text-2xl font-extrabold tracking-tight">ตั้งรหัสผ่านใหม่</h1>
        <p class="mt-2 text-sm leading-relaxed text-slate-600">สวัสดี {{ reset_user_name }} ตั้งรหัสผ่านใหม่ที่ยาวอย่างน้อย 12 ตัวอักษร และมีทั้งตัวอักษรกับตัวเลข</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <p class="mt-5 rounded-2xl border p-3 text-xs font-semibold {% if category == 'error' %}border-rose-200 bg-rose-50 text-rose-700{% else %}border-emerald-200 bg-emerald-50 text-emerald-700{% endif %}">{{ message }}</p>
        {% endfor %}
        {% endwith %}
        <form method="POST" class="mt-6 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="newPassword" class="block text-xs font-bold uppercase tracking-wider text-slate-500">รหัสผ่านใหม่</label>
                <input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="12" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100">
            </div>
            <div>
                <label for="newPasswordConfirmation" class="block text-xs font-bold uppercase tracking-wider text-slate-500">ยืนยันรหัสผ่านใหม่</label>
                <input id="newPasswordConfirmation" name="new_password_confirmation" type="password" autocomplete="new-password" minlength="12" required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-100">
            </div>
            <button type="submit" class="w-full rounded-xl bg-teal-700 px-4 py-3 text-sm font-bold text-white transition hover:bg-teal-800">บันทึกรหัสผ่านใหม่</button>
        </form>
    </main>
</body>
</html>
