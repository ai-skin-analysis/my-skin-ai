<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยันอีเมล | Smart Skin AI</title>
    <script nonce="{{ csp_nonce }}" src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Anuphan:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', 'Anuphan', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-950 px-4 py-10 text-slate-900 sm:flex sm:items-center sm:justify-center">
    <main class="w-full max-w-md rounded-[2rem] border border-slate-200 bg-white p-7 shadow-2xl sm:p-9">
        <span class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-teal-50 text-xl text-teal-700">✉</span>
        <h1 class="mt-5 text-2xl font-extrabold tracking-tight">ยืนยันอีเมลของคุณ</h1>
        <p class="mt-2 text-sm leading-relaxed text-slate-600">สวัสดี {{ verification_user_name }} กดปุ่มด้านล่างเพื่อยืนยันว่าอีเมลนี้เป็นของคุณ หลังจากนั้นบัญชีจะยังต้องรอผู้ดูแลอนุมัติการใช้งาน</p>
        <form method="POST" class="mt-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="w-full rounded-xl bg-teal-700 px-4 py-3 text-sm font-bold text-white transition hover:bg-teal-800">ยืนยันอีเมล</button>
        </form>
    </main>
</body>
</html>
